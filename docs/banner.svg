<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="FactorioReforge — a process manager and plugin framework for Factorio headless servers">
  <title>FactorioReforge</title>

  <defs>
    <!-- Factorio's palette: near-black panel, hot metal orange. -->
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1e22"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a33c"/>
      <stop offset="1" stop-color="#d4761a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4761a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4761a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d4761a" stop-opacity="0"/>
    </linearGradient>

    <!-- Blueprint grid, kept faint so it reads as texture rather than content. -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="14" fill="url(#panel)"/>
  <rect width="1200" height="330" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Gear: the one unambiguous Factorio glyph, and it doubles as "framework".
       The teeth are a dashed thick stroke rather than eight drawn spokes — the
       spokes version read as a compass rose, not a cog. -->
  <g transform="translate(114 146)">
    <circle r="44" fill="none" stroke="url(#hot)" stroke-width="18"
            stroke-dasharray="16 11.9" stroke-dashoffset="8"/>
    <circle r="35" fill="none" stroke="url(#hot)" stroke-width="9"/>
    <circle r="13" fill="none" stroke="url(#hot)" stroke-width="9"/>
  </g>

  <!-- Wordmark. "Reforge" carries the accent: it is the part that says what this is. -->
  <text x="228" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#f2f3f5">Factorio</tspan><tspan fill="url(#hot)">Reforge</tspan>
  </text>

  <text x="230" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9aa1ab">
    A process manager and plugin framework for Factorio headless servers
  </text>

  <!-- Feature chips: what you actually get, in the order you meet them. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c8ccd2">
    <g>
      <rect x="230" y="216" width="176" height="32" rx="16" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="318" y="237" text-anchor="middle">hot-reload plugins</text>
    </g>
    <g>
      <rect x="418" y="216" width="168" height="32" rx="16" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="502" y="237" text-anchor="middle">snapshot rollback</text>
    </g>
    <g>
      <rect x="598" y="216" width="152" height="32" rx="16" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="674" y="237" text-anchor="middle">mod installs</text>
    </g>
    <g>
      <rect x="762" y="216" width="136" height="32" rx="16" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="830" y="237" text-anchor="middle">RCON + Lua</text>
    </g>
    <g>
      <rect x="910" y="216" width="126" height="32" rx="16" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="973" y="237" text-anchor="middle">Telegram</text>
    </g>
  </g>

  <!-- A transport belt across the bottom: the stdout stream this thing is built on.
       Two rails and dense chevrons, so it reads as a belt rather than as a row
       of stray arrowheads. -->
  <g transform="translate(0 284)">
    <line x1="56" y1="-11" x2="1144" y2="-11" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
    <line x1="56" y1="11" x2="1144" y2="11" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
    <line x1="56" y1="0" x2="1144" y2="0" stroke="url(#fade)" stroke-width="22" stroke-opacity="0.10"/>
    <g stroke="url(#fade)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M96 -6 L106 0 L96 6"/>   <path d="M136 -6 L146 0 L136 6"/>
      <path d="M176 -6 L186 0 L176 6"/> <path d="M216 -6 L226 0 L216 6"/>
      <path d="M256 -6 L266 0 L256 6"/> <path d="M296 -6 L306 0 L296 6"/>
      <path d="M336 -6 L346 0 L336 6"/> <path d="M376 -6 L386 0 L376 6"/>
      <path d="M416 -6 L426 0 L416 6"/> <path d="M456 -6 L466 0 L456 6"/>
      <path d="M496 -6 L506 0 L496 6"/> <path d="M536 -6 L546 0 L536 6"/>
      <path d="M576 -6 L586 0 L576 6"/> <path d="M616 -6 L626 0 L616 6"/>
      <path d="M656 -6 L666 0 L656 6"/> <path d="M696 -6 L706 0 L696 6"/>
      <path d="M736 -6 L746 0 L736 6"/> <path d="M776 -6 L786 0 L776 6"/>
      <path d="M816 -6 L826 0 L816 6"/> <path d="M856 -6 L866 0 L856 6"/>
      <path d="M896 -6 L906 0 L896 6"/> <path d="M936 -6 L946 0 L936 6"/>
      <path d="M976 -6 L986 0 L976 6"/> <path d="M1016 -6 L1026 0 L1016 6"/>
      <path d="M1056 -6 L1066 0 L1056 6"/>
    </g>
  </g>

  <text x="1144" y="146" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b727c">
    Factorio 2.0 · Python 3.11+
  </text>
</svg>
