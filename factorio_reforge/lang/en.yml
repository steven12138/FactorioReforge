# Core translations. English is the fallback for every other language, so a key
# missing here will render as the key itself -- which is the intent: a visible
# `save.no_slot` in chat says exactly what to add.

common:
  enabled: "yes"
  disabled: "no"
  none: "none"
  empty: "empty"
  unknown: "unknown"
  console: console
  cancelled: Cancelled
  nothing_to_cancel: Nothing to cancel

server:
  starting: Starting...
  already_running: The server is already running
  stopping: Stopping the server...
  stopped: Server stopped
  restarting: Restarting the server...
  not_running: The server is not running
  killing: "SIGKILL -- everything since the last save is lost"
  exiting: Stopping the server, then exiting
  startup_complete: Server startup complete
  rcon_connected: RCON connected

status:
  header: "FactorioReforge {version} - up {uptime}"
  server: "Server: {state}"
  server_with_pid: "Server: {state} (pid {pid}, up {uptime})"
  rcon: "RCON: {state}"
  connected: connected
  disconnected: not connected
  plugins: "Plugins: {count} loaded"
  backups: "Backups: {count} slots in use"
  online: "Online ({count}): {names}"
  online_unavailable: "Online: unavailable ({error})"

plugin:
  none_loaded: No plugins loaded
  count: "{count} plugin(s):"
  file_changed: " [file changed]"
  reloaded: "Reloaded {id}"
  reload_failed: "Could not reload {id}"
  unloaded: "Unloaded {id}"
  not_found: "No such plugin: {id}"
  reloaded_changed: "Reloaded: {names}"
  nothing_changed: No plugin files have changed
  entry: "  {id} v{version} - {description}{changed}"
  entry_commands: "      commands: {commands}"
  help_hint: "{prefix}help <plugin> shows what one plugin offers"

permission:
  default: "Default level: {level}"
  no_overrides: No per-player overrides
  changed: "{player} is now {level}"
  denied: Permission denied
  requires: "Requires permission {level}"

save:
  slot_describe: "slot {slot}: {time} by {by} ({size} MiB) - {comment}"
  saving: Saving...
  created: "Backed up to {slot}"
  failed: "Backup failed: {error}"
  no_slot: "No slot free: {error}"
  header: "Backup slots ({size} MiB total):"
  slot_empty: "  slot {slot}: empty"
  protected: "  [protected for another {duration}]"
  protection_expired: "  [protection expired]"
  overwrite: "  overwrite: {time} - the world from before the last restore"
  auto_header: "Automatic slots (the schedule's own ring):"
  restore_hint: "Restore with '{prefix} back <slot>', then '{prefix} confirm'."
  about_to_restore: "About to restore {slot}"
  confirm_hint: >-
    This stops the server and replaces the current world.
    '{prefix} confirm' within {seconds}s to go ahead, '{prefix} abort' to cancel.
  nothing_staged: "Nothing staged. Start with '{prefix} back <slot>'"
  confirm_expired: That confirmation expired; run the command again
  restored: "Restored {slot}"
  restore_failed: "Restore failed: {error}"
  cancelling_countdown: Cancelling the restore that is counting down
  deleted: "Deleted {slot}"
  renamed: "Renamed: {slot}"
  countdown: "[FactorioReforge] Restoring slot {slot} ({time}) in {seconds}s -- {prefix} abort to cancel"
  countdown_cancelled: "[FactorioReforge] Restore cancelled"

help:
  header: "FactorioReforge {version}"
  header_counts: "FactorioReforge {version} -- {plugins} plugins, {commands} commands (page {page}/{pages})"
  core_header: "Core:"
  core_summary: "status | plugin | reload | server | permission | lang | exit"
  plugins_header: "Plugins -- '{prefix} <name>' for one, or any word to search:"
  more: "{prefix} {page} for the next page ({pages} in total)"
  matches: "{count} match(es) for {term}:"
  no_match: "Nothing matches {term}. '{prefix}' lists everything."
  from_plugin: "      from {id} -- {prefix} {id}"
  plugin_header: "{name} ({id})"
  plugin_version: "  v{version} by {author}"
  no_commands: "  (registers no commands)"
  detail_hint: "{prefix} help <plugin> for one plugin in detail"
  status: "server and framework state"
  plugin_list: "loaded plugins"
  plugin_reload: "reload one plugin"
  reload: "reload every changed plugin"
  server: "start, stop, restart or kill the server"
  permission: "view or change permissions"
  exit: "stop the server and quit"
  qb: "backups: make, list, restore"

error:
  rcon_down: "RCON is not connected"
  lookup_failed: "Could not look that up: {error}"
  unknown_command: "Unknown command: {command}"
  internal: "Command failed: internal error in plugin {plugin}"
  console_only: "That only works in game -- the console has no position."

lang:
  current: "Language: {language}"
  available: "Available: {languages}"
  keys: "{count} key(s) loaded"
  complete: "{language} is complete"
  incomplete: "{language} is missing {count} key(s)"
  changed: "Language is now {language}"
  unknown: "No translations for {language!r}. Available: {languages}"

log:
  config_retired: "config.yml: {section}.{key} is no longer used -- {reason}"
  plugin_loaded: "Loaded plugin {plugin}"
  plugin_unloaded: "Unloaded plugin {id}"
  plugin_load_failed: "Plugin {id} failed during load"
  plugin_import_failed: "Failed to import plugin {name}: {error}"
  plugins_loaded: "Loaded {count} plugin(s)"
  plugins_loaded_with_failures: "Loaded {count} plugin(s), {failed} failed: {names}"
  starting_server: "Starting server: {command}"
  server_started: "Server started, pid={pid}"
  server_exited: "Server process exited with code {code}"
  server_crashed: "Server exited unexpectedly (code {code})"
  server_start_failed: "Could not start the server: {error}"
  server_already_running: Server is already running
  sending_quit: "Sending /quit"
  quit_timeout: "/quit did not finish in {seconds}s, sending SIGINT"
  sigint_timeout: "SIGINT did not finish, sending SIGTERM (map will NOT be saved)"
  sigterm_timeout: "SIGTERM ignored, sending SIGKILL"
  startup_complete: Server startup complete
  rcon_connected: "RCON connected to {host}:{port}"
  rcon_giving_up: "{error} -- giving up on RCON"
  shutting_down: Shutting down FactorioReforge
  goodbye: Goodbye
  interrupt: Stopping the server, then exiting
  second_interrupt: "Second interrupt -- killing the server now"
  ctrl_c: Ctrl-C received
  ctrl_d: Ctrl-D received
  console_eof: Console EOF
  no_console: No console attached; input is closed
  console_orphaned: "Console closed but nothing is listening for it; the server is still running. Use !!FR exit or send SIGTERM."
  restarting_in: "Restarting in {seconds}s"
  backup_created: "Created {slot}"
  backup_dropped: "Dropping {slot} to make room for the new backup"
  backup_restored: "Restored slot {slot} onto {path}"
  world_preserved: Preserved the current world in the overwrite slot
  restore_countdown_cancelled: Restore cancelled during the countdown
  restore_preserving: Preserving the current world before overwriting it
  restore_done: "Restored {slot}"
  restore_recovering: Putting the pre-restore world back
  unknown_tag: "Unrecognised game event tag [{tag}]; treating it as a plain message. Please report it so a parser rule can be added."
  save_timeout: "No save-completion message within {seconds}s"
banner: "Type {prefix}FR help for commands. Anything else goes to the Factorio console."

retired:
  max_snapshots: "replaced by saves.slot_protection, whose length is the slot count"
  max_snapshot_age_days: "replaced by the per-slot saves.slot_protection"

startup:
  cheats_open: "server-settings.json has allow_commands: true -- every player can run /c. Set it to admins-only or false unless that is deliberate."
  summary: "Startup check: {problems} problem(s), {notices} notice(s), {routine} routine"
  blueprint_storage: "no personal blueprint library ({current}); a headless server has no local player, so it never creates one. Harmless, and it appears on every start. Do not create the file by hand -- an empty one is read as corrupt."
  cloud_player_data: "no Steam cloud player data -- normal on a headless server"
  audio_disabled: "audio is off -- normal on a headless server"
  hosting: "listening for players on {address} (UDP)"
  rcon_local: "RCON is bound to {address}, which is not reachable from outside"
  rcon_exposed: "RCON is listening on {address} -- reachable from the network, and the protocol is plaintext. Use --rcon-bind 127.0.0.1:<port>."
  mod_loaded: "mod loaded: {mod} {version}"
  mod_failed: "the mod {mod!r} failed to load"
  version_mismatch: "a mod needs Factorio {need}, this server is {have}"
  dependency: "unsatisfied mod dependency: {dep}"
  locked: "another Factorio already owns this installation directory"
  port_in_use: "the port is already taken"
  desync: "a client fell out of sync"
  save_failed: "a save did not complete -- check disk space and permissions"
