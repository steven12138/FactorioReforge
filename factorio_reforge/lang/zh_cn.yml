  unknown_tag: "无法识别的游戏事件标签 [{tag}]，按普通消息处理。请反馈以便加上解析规则。"
  save_timeout: "{seconds} 秒内没有收到存档完成的消息"
banner: "输入 {prefix}FR help 查看命令。其他内容会原样转发给 Factorio 控制台。"

retired:
