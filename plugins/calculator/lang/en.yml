description: "Chat arithmetic, and production ratios solved from live recipe data"
help:
  expression: "arithmetic in chat"
  ratio: "what it takes to build something"
  recipe: "one recipe, with times and ratios"
  belt: "how many belts a rate needs"

detail:
  pointing: "With no item, it uses the machine you are hovering over, or what is in your cursor."
  options: "Options: rate 30/m, machine=foundry, prod=20, speed=50, modules=speed-module-3*4, raw=iron-plate, use=advanced-oil-processing"
  example: "Example: !!ratio electronic-circuit 5/s machine=assembling-machine-3"
  machine: "!!ratio machine -- which machine each plan uses; use/drop/auto to change it"

expression:
  result: "{expression} = {result}"
  failed: "Cannot work that out: {error}"

ratio:
  what: "What should I plan for? Name an item, or hover over a machine and try again."

refresh:
  done: "Recipe data cleared; the next question re-reads it from the game."

plan:
  header: "{item} at {rate}/s -- {machines} machines, {power}"
  modules: "  with {modules} in every machine"
  step: "  {machines} x {machine}  {recipe}  {rate}/s"
  step_crafts: "  {machines} x {machine}  {recipe}  {rate} crafts/s"
  more: "  ... and {count} more steps"
  raw: "  needs: {items}"
  surplus: "  byproducts: {items}"
  belts: "  output is {count} x {belt} ({throughput}/s)"
  not_researched: "Nothing researched can make that yet -- this plan assumes you unlock it."
  unresearched: "  not researched yet, so counted as an input: {items} (add all=1 to plan them out)"

recipe:
  line: "{recipe}: {seconds}s, {ingredients} -> {products}"
  machine: "  in {machine} (speed {speed}): {rate} crafts/s each"

belt:
  usage: "Usage: !!belt <rate>, for example !!belt 45/s or !!belt 900/m"
  none: "The server reported no transport belts."
  header: "{rate}/s needs:"
  line: "  {count} x {belt} ({throughput}/s, {lane}/s per lane)"

error:
  needs_server: "That needs the running game to read recipes from: {error}"
  too_deep: "That recipe graph goes too deep to follow: {error}"
  no_recipe: "Nothing makes {item}."
  no_recipe_hint: "Nothing makes {item}. Did you mean: {matches}"
  no_machine: "No machine on this server can craft {item}."
  infeasible: "There is no way to make {item} from what the recipes allow."
  unbounded: "These recipes produce something from nothing, so there is no answer."

machine:
  header: "Plans are written in these machines:"
  why_pinned: "   <- pinned"
  none_unlocked: "  nothing is unlocked yet, so plans name the machine you would reach first"
  locked_summary: "{count} more kind(s) of recipe have nothing unlocked; those plans name the machine you would reach first ({machines})."
  pinned: "Pinned: {machines}"
  automatic: "Nothing is pinned, so each plan uses the best machine this save can build. {prefix} use <name> to pin one."
  auto_hint: "{prefix} auto goes back to using the best machine this save can build."
  now_automatic: "Cleared. Plans now use the best machine this save can build."
  now_pinned: "Pinned {name} for: {categories}"
  not_unlocked: "Note: {name} is not unlocked on this save yet, so plans will name a machine you cannot place."
  dropped: "{name} is no longer pinned."
  not_pinned: "{name} was not pinned."
  unknown: "There is no machine called {name}."
  did_you_mean: "Did you mean: {names}"
  no_data: "Could not read the machine list from the server: {error}"
  migrated: "calculator: machine preference was still the old hardcoded list; cleared it, so plans now use the best machine this save can build"
