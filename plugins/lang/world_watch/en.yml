  rocket: "🚀 Rocket #{count} launched"
  research: "🔬 Research complete: {tag} {name}"
status:
  failed: "Could not read the world: {error}"
  evolution: "Evolution: {value}"
  pollution: "Pollution: {value}"
  research: "Research: {done}/{total} done{current}"
  researching: ", now on {name}"
  idle: ", idle"
  rockets: "Rockets launched: {count}"
  next_alert: "Next evolution alert at {threshold}"
