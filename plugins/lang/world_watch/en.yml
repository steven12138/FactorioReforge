help: alert and milestone state
alert:
  evolution: "⚠️ Evolution has passed {threshold} (now {value})"
  evolution_detail: "Biters are getting stronger -- time to check the defences."
  pollution: "⚠️ Pollution has passed {threshold} (now {value})"
  pollution_detail: "A bigger cloud reaches more nests, which means bigger attacks."
milestone:
