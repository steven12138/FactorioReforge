description: "Leave messages for players who are offline"
help: leave a message for someone who is offline
detail:
  read: "!!mail reads yours; they are also delivered a few seconds after you join"

send:
  stored: "Saved for {player}; they will get it when they next join."
  broadcast: "Left for {count} player(s)."

read:
